  const elNodes=document.getElementById('tlNodes');
  const elPrev=document.getElementById('tlPrev');
  const elCount=document.getElementById('tlCount');
  const elParks=document.getElementById('tlParks');
  const elFilm=document.getElementById('tlFilm');
  const lead=root.querySelector('.tl-lead');
  const halo=root.querySelector('.tl-halo');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)');

  let data=null, loading=null, built=false, on=false, active=null, marker=null;

  const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const label=(iso)=>{ const [y,m,d]=iso.split('-'); return (+d)+' '+MON[+m-1]+' '+y; };
  // captions carry &mdash; and &rarr;; they are content, not markup
  const decode=(t)=>{ const x=document.createElement('textarea'); x.innerHTML=t||''; return x.value; };

  // The <ktp-compare> element is one component serving both packs -- it lives
  // under uploads/ktp because that is where it was written, not because it is
  // KTP's. Imported once, whichever campus asks first.
  let elemP=null;
  const element=()=>elemP||(elemP=import('./uploads/ktp/web/ktp-compare.js').catch(()=>null));
  function load(){
    const p=pack;
    if(CACHE[p.id]){ data=CACHE[p.id]; return Promise.resolve(data); }
    return Promise.all([
      fetch(p.base+p.manifest).then(r=>r.json()),
      element()
    ]).then(([j])=>{ CACHE[p.id]=j; if(pack===p) data=j; return j; });
  }

  function paintParks(){
    if(elParks.children.length!==PACKS.length){
      elParks.innerHTML=PACKS.map(p=>'<button type="button" data-p="'+p.id+'">'+p.label+'</button>').join('');
      elParks.querySelectorAll('button').forEach(b=>b.addEventListener('click',(e)=>{
        e.stopPropagation(); selectPack(b.dataset.p); }));
    }
    elParks.querySelectorAll('button').forEach(b=>
      b.setAttribute('aria-pressed', String(b.dataset.p===pack.id)));
  }

  /* THE CORNER FILM replaces the old Film button.
     A button made the visitor discover and press a control for the one thing on
     this panel that can just be playing, and it competed with KTP/NTP in the
     same strip as though "Film" were a third campus. Now selecting a campus
     starts its film in the corner, and the strip holds only campuses again.
     Clicking the corner still opens the big draggable card -- showFilm() and
     wireFilm() are untouched, so nothing that could be done before is lost. */
  let cornerVid=null;
  function paintFilm(){
    const f=pack.film;
    if(!f){
      if(cornerVid){ try{ cornerVid.pause(); }catch(_){}
        cornerVid.removeAttribute('src'); try{ cornerVid.load(); }catch(_){} }
      cornerVid=null;
      elFilm.className='tl-corner'; elFilm.innerHTML=''; elFilm.setAttribute('aria-hidden','true');
      return;
    }
    // Rebuild only on a change of film; re-rendering identical markup would
    // restart the clip every time the panel repaints, which it does on hover.
    if(elFilm.dataset.src===f.src){ return; }
    elFilm.dataset.src=f.src;
    /* src AND autoplay in the markup, never `el.src=…` followed by `el.play()`.
       Measured: the assign-then-play form stalls at readyState 1 -- metadata
       arrives, the browser fires `suspend`, and `canplay` never comes, so the
       poster sits there looking like a still. A bare <video> outside this panel
       stalls exactly the same way, so it is the shape of the call and not the
       globe. The autoplay attribute makes the browser commit to buffering,
       which is also why the About gallery loops and the home aerial band work. */
    elFilm.innerHTML=
      '<span class="tl-cwrap">'
      +'<video src="'+f.src+'" poster="'+f.poster+'"'
      +' autoplay muted loop playsinline preload="auto"></video>'
      +'<span class="tl-cgrad"></span>'
      +'<span class="tl-ctitle">'+f.title+'</span>'
      +'<span class="tl-chint">Enlarge</span>'
      +'</span>'
      +'<p class="tl-cnote">'+f.note+'</p>';
    elFilm.className='tl-corner live';
    elFilm.setAttribute('aria-hidden','false');
    cornerVid=elFilm.querySelector('video');
    cornerVid.muted=true; cornerVid.playsInline=true;
    elFilm.querySelector('.tl-cwrap').addEventListener('click',(e)=>{
      e.stopPropagation(); showFilm(); });
    syncCorner();
  }

  /* A clip behind display:none keeps decoding, and CSS cannot stop it. The
     media query above removes the film on a narrow stage, so the pause has to
     be driven from the same condition -- otherwise a phone pays for a video it
     is never shown. Re-checked on resize because that is when it changes. */
  const narrow=matchMedia('(max-width:700px)');
  function syncCorner(){
    if(!cornerVid) return;
    if(narrow.matches){ try{ cornerVid.pause(); }catch(_){} return; }
    if(cornerVid.paused){ const p=cornerVid.play(); if(p&&p.catch) p.catch(()=>{}); }
  }
  narrow.addEventListener('change', syncCorner);

  /* THE FILM. Rendered into the same preview card the visits use, so it gets
     the enlarge catcher, the Esc button and the positioning for free.
     `preload="none"` until the card is enlarged -- the poster is 0.2MB and the
     clip is 9.4MB, and hovering a rail must never cost the clip. */
  let filmOn=false, filmVid=null;
  /* filmOn was set and never cleared, so the button stayed lit over a card
     that had been replaced by a hover -- it claimed a film was showing when
     one was not. Every exit from the film goes through here. */
  function endFilm(){
    if(!filmOn) return;
    filmOn=false;
    if(filmVid){ try{ filmVid.pause(); }catch(_){}
      filmVid.removeAttribute('src'); try{ filmVid.load(); }catch(_){} }
    filmVid=null;
    paintParks(); paintFilm();
  }
  function showFilm(){
    if(!pack.film) return;
    const f=pack.film;
    active=null; filmOn=true;
    elPrev.innerHTML=
      '<span class="tl-film-wrap">'
      +'<video class="tl-film" preload="none" muted loop playsinline'
      +' poster="'+f.poster+'"></video>'
      +'<span class="tl-film-hint">Drag to fly</span>'
      +'<span class="tl-scrub"><i></i></span></span>'
      +'<div class="tl-cap"><b>'+f.title+'</b><p>'+f.note+'</p></div>';
    elPrev.insertAdjacentHTML('afterbegin',
      '<button class="tl-open" type="button" aria-label="Enlarge"></button>');
    elPrev.insertAdjacentHTML('beforeend',
      '<button class="tl-shut" type="button" aria-label="Close">Esc</button>');
    filmVid=elPrev.querySelector('.tl-film');
    wireFilm(elPrev.querySelector('.tl-film-wrap'), filmVid,
             elPrev.querySelector('.tl-scrub i'), f,
             elPrev.querySelector('.tl-film-hint'));
    const first=elNodes.querySelector('button');
    if(first) position(first);
    elPrev.classList.add('on'); root.classList.add('prev');
    paintParks(); paintFilm(); frame();
  }

  function wireFilm(wrap, v, bar, f, hint){
    // Only fetch the clip once the card is big; that is also the only size at
    // which the .tl-open catcher is gone and a drag can reach the picture.
    const arm=()=>{
      if(v.getAttribute('src')) return;
      v.setAttribute('preload','auto'); v.src=f.src;
    };
    // A POINTER EVENT MUST NOT BE DROPPED BECAUSE A SEEK IS IN FLIGHT. Assigning
    // currentTime only when !v.seeking loses every move made during a seek, and
    // over a network that is most of them -- on the local disk a drag landed at
    // 8.60s, on the deployed site the identical drag left it at 0.00s. So the
    // pointer only records a target and a rAF loop chases it, which is the same
    // shape the scroll hero uses and also what makes the drag feel smooth.
    let want=null, cur=0, raf=0;
    const chase=()=>{
      raf=0;
      if(!(v.duration>0)) return;
      if(want!==null){
        cur+=(want-cur)*0.35;
        if(Math.abs(want-cur)<0.002) cur=want;
        if(!v.seeking) v.currentTime=cur*(v.duration-0.05);
        bar.style.width=(cur*100).toFixed(1)+'%';
        if(cur!==want || v.seeking) raf=requestAnimationFrame(chase); else want=null;
      }
    };
    const seek=(clientX)=>{
      const r=wrap.getBoundingClientRect();
      if(!r.width) return;
      want=Math.min(1,Math.max(0,(clientX-r.left)/r.width));
      if(!raf) raf=requestAnimationFrame(chase);
    };
    /* SCRUBBING NEEDS THE HOST TO SERVE HTTP RANGE, AND OURS DOES NOT.
       Cloudflare Pages answers a Range request for /uploads/* with a plain 200
       and no Accept-Ranges, warm or cold, so the browser marks the clip
       unseekable: buffered runs 0-11.39 while seekable stays 0-0, and assigning
       currentTime reads straight back as 0. Every scrub mp4 on this site is in
       that state, including the two hero encodes that have shipped for weeks --
       it is the host, not this card.
       So the control is chosen from what the element can actually do, not from
       what we hoped: drag to fly where seeking works, plain playback where it
       does not. Delete this branch the day /uploads/* answers 206. */
    const canSeek=()=>v.seekable && v.seekable.length>0 && v.seekable.end(0)>0.5;
    let mode=null;
    const setMode=()=>{
      // Small card: the only useful action is to open it, so say that. Big card:
      // say how to drive it, which depends on whether the host allows seeking.
      const big=elPrev.classList.contains('big');
      const m = !big ? 'open' : (canSeek() ? 'seek' : 'play');
      // ENLARGING IS THE PLAY GESTURE. Where the clip cannot be scrubbed there is
      // nothing to drive, so asking for a second click to start it was a step
      // that carried no decision. Opening it starts it; the click is left as the
      // pause. Muted autoplay needs no gesture of its own, and the enlarge was
      // one anyway.
      // Only on ENTERING play -- recomputing must not restart it, or the pause
      // click is undone by the pause event that the click itself fires.
      if(m!==mode && m==='play') wantPlay=true;
      if(m!=='play'){ wantPlay=false; if(!v.paused) v.pause(); }
      mode=m;
      tryPlay();
      paint();
    };
    /* WANTING TO PLAY AND BEING ABLE TO ARE NOT THE SAME MOMENT. Enlarging sets
       the src and flips the class in the same beat, so the first play() lands on
       a video that has no source yet, the promise rejects, and nothing retries --
       the card sat there paused saying "Click to play". The intent is held and
       re-attempted as the media becomes usable. */
    let wantPlay=false;
    const tryPlay=()=>{
      if(!wantPlay || !v.paused || v.readyState<2) return;
      v.play().catch(()=>{});
    };
    for(const e of ['loadeddata','canplay','canplaythrough']) v.addEventListener(e,tryPlay);
    const paint=()=>{
      const label = mode==='open' ? 'Click to enlarge'
                  : mode==='seek' ? 'Drag to fly'
                  : (v.paused ? 'Click to play' : '');
      hint.textContent = label;
      hint.style.display = label ? '' : 'none';
      wrap.style.cursor = mode==='seek' ? 'ew-resize' : 'pointer';
    };
    // the label follows play/pause; the MODE does not change with them
    v.addEventListener('play', paint);
    v.addEventListener('pause', paint);
    // the mode changes when the card is enlarged, not only when media loads
    new MutationObserver(setMode).observe(elPrev,{attributes:true,attributeFilter:['class']});
    setMode();
    v.addEventListener('loadedmetadata',setMode);
    v.addEventListener('canplay',setMode);
    v.addEventListener('progress',setMode);
    wrap.addEventListener('pointerdown',(e)=>{
      if(!elPrev.classList.contains('big')) return;
      arm(); setMode();
      if(mode==='play'){ wantPlay=v.paused; if(v.paused) v.play().catch(()=>{}); else v.pause(); return; }
      try{ wrap.setPointerCapture(e.pointerId); }catch(_){}
      seek(e.clientX); e.preventDefault();
    });
    wrap.addEventListener('pointermove',(e)=>{
      if(e.buttons&&wrap.hasPointerCapture(e.pointerId)) seek(e.clientX);
    });
    v.addEventListener('timeupdate',()=>{
      if(v.duration>0) bar.style.width=(v.currentTime/v.duration*100).toFixed(1)+'%';
    });
    // Enlarging is what arms the download, whichever control did it.
    new MutationObserver(()=>{ if(elPrev.classList.contains('big')) arm(); })
      .observe(elPrev,{attributes:true,attributeFilter:['class']});
  }

  /* A stale fetch must not paint over a campus the reader has already switched
     back to, so every switch takes a ticket and only the current one may build. */
  function selectPack(id){
    const p=PACKS.find(x=>x.id===id);
    if(!p||p===pack) return;
    endFilm();
    pack=p; built=false; active=null;
    const mine=++seq;
    paintParks(); paintFilm();
    collapse(); elPrev.classList.remove('on','big'); root.classList.remove('prev');
    elNodes.innerHTML=''; elCount.textContent='';
    load().then(()=>{ if(mine!==seq) return; build(); openDefault(); }).catch(()=>{});
  }

  /* A node is a visit. Its preview is a pair whose AFTER is that visit -- what
     this trip showed against the one before it. Four of the seven have none:
     the two 2024 orthomosaics carry no obliques at all, 31 Dec 2024 is a single
     frame, and 11 Aug 2025 is the baseline every later pair is measured from.
     They get told what they are. Borrowing another visit's pair to fill the
     card would make the rail look complete and be a lie. */
  function nodeModel(sh){
    const cmps=data.comparisons.filter(c=>c.after.date===sh.date);
    const frames=data.frames.filter(f=>f.date===sh.date && f.media && (f.media.jpg||f.media.webp));
    const asBefore=data.comparisons.filter(c=>c.before.date===sh.date).length;
    const mixed=cmps.some(c=>(data.sets.find(x=>x.id===c.set)||{}).confidence==='mixed');
    return {sh, cmps, frames, asBefore, mixed,
      date:label(sh.date), archive:sh.date<'2025',
      meta: sh.frames ? sh.frames+(sh.frames===1?' frame':' frames') : sh.kind};
  }

  function build(){
    /* EVERY NODE HAS A PICTURE BEHIND IT. Seven visits are in the manifest and
       two of them -- the November and December 2024 orthomosaics -- carry no
       frames and no pairs, so they used to render a card with a sentence where
       an image goes. A rail of dates that opens onto nothing is worse than a
       shorter rail: it makes the survey look thinner than it is by drawing
       attention to the gaps rather than to the material.
       So a visit earns a node by having imagery -- a comparison to sweep, or
       failing that its own frames.
       The count is of what the rail shows, not of what the manifest holds. It
       read "5 of 7 visits" for a while, on the reasoning that dropping two dates
       silently overstates the survey. It does not: this rail is the imagery, and
       a fraction in the header makes a visitor count the missing two instead of
       looking at the five that are there. The two orthomosaic dates are still in
       the manifest for anyone working with the data. */
    const models=data.shoots.map(nodeModel).filter(n=>n.cmps.length||n.frames.length);
    /* THE RATIO IS STATED ONLY WHERE FAILING TO REGISTER IS THE NORMAL CASE.
       KTP registers 12 of 14, and a fraction in the header would make a visitor
       count the two exceptions instead of reading the five visits -- that is why
       it says "5 visits" and not "5 of 7". NTP registers 1 of 8, and that IS the
       survey's headline: its manifest says so in its own `finding` field, and
       the one pair that did register is the building that never changed. So the
       rule is majority, not a per-campus special case. */
    const reg=data.comparisons.filter(c=>c.registered===true).length;
    const total=data.comparisons.length;
    elCount.textContent=models.length+' visits'
      +((total-reg)>reg ? ' · '+reg+' of '+total+' registered' : '');
    elNodes.innerHTML='';
    let dividerPlaced=false;
    models.forEach((n,i)=>{
      if(!n.archive && !dividerPlaced && i>0){
        const d=document.createElement('div'); d.className='tl-divide';
        d.innerHTML='<i>2025 survey</i>'; elNodes.appendChild(d); dividerPlaced=true;
      }
      const b=document.createElement('button');
      b.type='button'; b.className='tl-node'+(n.archive?' arch':'');
      b.setAttribute('role','option'); b.setAttribute('aria-selected','false');
      b.tabIndex=-1;
      b.innerHTML='<span class="tl-dot"></span><span class="tl-txt">'
        +'<span class="tl-date">'+n.date+'</span>'
        +'<span class="tl-meta">'+n.meta+(n.mixed?'<span class="tl-mix" title="One set in this visit is mixed confidence"></span>':'')+'</span>'
        +'</span>';
      // Hovering a date must not steal a film the reader asked for. Moving
      // the cursor from the Film button toward the card crosses the rail,
      // and every crossing used to replace the clip with a visit preview --
      // which is why clicking Film looked like nothing happened.
      b.addEventListener('mouseenter',()=>{ if(filmOn) return; touch(); open(n,b); });
      b.addEventListener('focus',()=>{ touch(); open(n,b); });
      b.addEventListener('click',()=>{ touch();
        if(filmOn){ endFilm(); open(n,b); return; }   // explicit: take it back
        expand(n); });
      b.addEventListener('keydown',(e)=>{
        if(e.key==='ArrowDown'||e.key==='ArrowUp'){
          e.preventDefault();
          const all=[...elNodes.querySelectorAll('.tl-node')];
          const at=all.indexOf(b)+(e.key==='ArrowDown'?1:-1);
          if(all[at]) all[at].focus();
        } else if(e.key==='Enter'||e.key===' '){ e.preventDefault(); expand(n); }
      });
      b.__n=n; elNodes.appendChild(b);
    });
    /* Leaving the rail puts it back to its opening state rather than to nothing.
       An empty rail is the thing this was built to avoid, and it should not
       come back the moment the pointer wanders off. */
    elNodes.addEventListener('mouseleave',()=>{ if(filmOn) return; if(!elPrev.classList.contains('big')) openDefault(); });
    built=true;
  }

  /* THE RAIL ARRIVES WITH A PICTURE ALREADY OPEN. A column of dates is not an
     invitation -- nothing about it says the dates are the way in, so somebody
     who does not think to hover one sees a list and moves on, and the whole
     survey stays behind a gesture nobody made. Opening the newest visit puts a
     photograph on screen the moment Johor is selected, and the sweep across it
     says the rest: these are before and after, and the dates are how you move
     between them.
     The newest visit is the right default -- it is the site as it stands, and it
     is the one with the most pairs behind it. */
  function openDefault(){
    const b=elNodes.querySelector('.tl-node:last-of-type');
    if(b && b.__n) open(b.__n,b);
  }

  /* ONE PREVIEW AT A TIME, and it sweeps once. The component's own sweep is
     already the curve this wanted -- 2600ms ease-in-out-cubic, out to the after
     side and back to rest at 4 -- and it cuts straight to 4 under reduced
     motion, so there is nothing to reimplement here. */
  function open(n,btn){
    if(active===n) return;
    active=n;
    for(const b of elNodes.querySelectorAll('.tl-node')){
      const sel=b===btn; b.classList.toggle('sel',sel); b.setAttribute('aria-selected',String(sel));
    }
    const c=n.cmps[0];
    if(!c){
      // No pair, but there are frames -- show one rather than a caption in an
      // empty box. It says what the stage is and why there is nothing to sweep.
      const f=n.frames[0], m=f.media;
      const note = n.asBefore
        ? 'The baseline '+n.asBefore+' later comparison'+(n.asBefore>1?'s are':' is')
          +' measured from. '+n.frames.length+(n.frames.length===1?' frame':' frames')
          +' this visit, none of them paired against an earlier one.'
        : n.frames.length+(n.frames.length===1?' frame':' frames')
          +' this visit, with nothing earlier to compare against.';
      elPrev.innerHTML='<img class="tl-shot" src="'+pack.base+m.jpg+'" alt="" '
        +(m.webp?'srcset="'+pack.base+m.webp+'"':'')+'>'
        +'<div class="tl-cap"><b>'+(f.stage||n.date)+'</b><p>'+note+'</p></div>';
    }else{
      const m=c.media;
      // NTP's compare images were packed as JPEG only -- no WebP variants were
      // ever generated for it. Asking for .webp there yields `undefined` in the
      // srcset, which the browser fetches as a relative path and 404s, and the
      // card silently shows nothing. Fall back to whatever the manifest has.
      const u=(o,k,e)=>pack.base+(o[k][e]||o[k].jpg||o[k].webp);
      elPrev.innerHTML='<ktp-compare '
        +'before="'+u(m.before,'1600','jpg')+'" after="'+u(m.after,'1600','jpg')+'" '
        +'before-srcset="'+u(m.before,'800','webp')+' 800w, '+u(m.before,'1600','webp')+' 1600w" '
        +'after-srcset="'+u(m.after,'800','webp')+' 800w, '+u(m.after,'1600','webp')+' 1600w" '
        +'sizes="(max-width: 760px) 100vw, 260px" '
        +'before-label="'+c.before.date_label+'" after-label="'+c.after.date_label+'" '
        +'ratio="'+(m.aspect||'1600/900')+'" no-sweep></ktp-compare>'
        +'<div class="tl-cap"><b>'+c.title+'</b><p>'+decode(c.caption)+'</p>'
        +(c.registered===false
            ? '<span class="tl-chip" title="'+(c.registration&&c.registration.note||'')+'">Not registered &middot; wipe</span>'
            : '')
        +'</div>';
      // Over the small card only. At 216px the slider is a fiddle and the
      // useful action is "show me this properly"; at full size the catcher is
      // gone and the slider is the point.
      elPrev.insertAdjacentHTML('afterbegin',
        '<button class="tl-open" type="button" aria-label="Enlarge"></button>');
      const cmp=elPrev.querySelector('ktp-compare');
      // Rest on the AFTER frame either way. The component's own reduced-motion
      // branch reads `value > 50 ? 4 : 96`, and a fresh element sits at exactly
      // 50, so it lands on 96 -- the before frame, the opposite of where the
      // sweep would have left it. Set it here rather than patching a vendored
      // file: same destination, no motion.
      if(cmp) requestAnimationFrame(()=>{
        if(reduce.matches) cmp.value=4; else if(cmp.sweep) cmp.sweep();
      });
    }
    position(btn);
    elPrev.insertAdjacentHTML('beforeend',
      '<button class="tl-shut" type="button" aria-label="Close">Esc</button>');
    elPrev.classList.add('on'); root.classList.add('prev');
    frame();
  }

  function close(){
    endFilm();
    active=null; elPrev.classList.remove('on'); root.classList.remove('prev');
    for(const b of elNodes.querySelectorAll('.tl-node')){
      b.classList.remove('sel'); b.setAttribute('aria-selected','false');
    }
  }

  let activeBtn=null;
  function position(btn){
    activeBtn=btn;
    const st=stage.getBoundingClientRect(), r=btn.getBoundingClientRect();
    // 212 clears the longest date label -- "14 DEC 2025" at 11px mono runs to
    // about 196 from the axis at 76. Pulling the card in to 176 on a narrow
    // frame bought 36px of globe and clipped that label with the card's own
    // edge, which is the one thing the rail cannot afford to do: the date is
    // what the picture is being attached to. The card narrows instead.
    elPrev.style.left='212px';
    const h=elPrev.offsetHeight||210, w=elPrev.offsetWidth||256;
    const lo=88, hi=st.height-84-h;
    let top=Math.max(lo,Math.min(hi,(r.top-st.top)+r.height/2-h/2));
    /* AND IT MUST NOT SIT ON THE MARKER. Centring the card on its node is right
       on a wide frame, where the globe has drifted the marker well clear of it.
       On a narrower one the two collide: measured at 884x497, the card ran
       212-428 and Johor sat at 414,327 -- inside it. The marker disappears
       behind the card it is supposed to be tied to, and the leader line, whose
       whole job is to say "this picture belongs to that place", is drawn
       underneath and never seen.
       So when they overlap, the card steps aside by the smaller of the two
       moves, and only if there is room at the edge it steps toward. The globe
       holds still while a site is selected, so doing this once on open is
       enough -- the marker will not wander back underneath. */
    if(marker && marker.sx>212-8 && marker.sx<212+w+8
       && marker.sy>top && marker.sy<top+h){
      const gap=26, above=marker.sy-gap-h, below=marker.sy+gap;
      const okA=above>=lo, okB=below<=hi;
      if(okA&&okB) top = (top+h-marker.sy) <= (marker.sy-top) ? above : below;
      else if(okA) top=above;
      else if(okB) top=below;
    }
    elPrev.style.top=top+'px';
    /* SOMETIMES THERE IS NOWHERE TO STEP. A 497px frame leaves the rail a 325px
       band once the top and bottom margins are taken, and the card is 279 of it;
       with Johor sitting near the vertical middle, neither above nor below fits.
       When that happens the leader line is drawn underneath the card and never
       seen, which is worse than not drawing it: it is a line that claims to
       connect two things while connecting nothing. The card is adjacent to the
       marker at that size anyway, so the relationship still reads. */
    root.classList.toggle('nolead', !!(marker && marker.sx>212-8 && marker.sx<212+w+8
      && marker.sy>top && marker.sy<top+h));
  }

  /* The globe drifts, so the marker moves under a preview that is standing
     still. The elbow is redrawn from the live screen position every frame --
     markers already carry sx/sy for exactly this reason. */
  function frame(){
    if(!on||!active||!marker) return;
    const x1=elPrev.offsetLeft+elPrev.offsetWidth, y1=elPrev.offsetTop+elPrev.offsetHeight/2;
    const mx=marker.sx, my=marker.sy;
    if(!(mx>=0)||!(my>=0)) return;
    lead.setAttribute('d','M'+x1+' '+y1+' L'+mx+' '+y1+' L'+mx+' '+my);
    halo.setAttribute('transform','translate('+mx+' '+my+')');
  }

  /* CLICKING OPENS THE PICTURE, not a list about it.
     Clicking a node used to slide out a panel of set titles, view descriptions
     and a video per set. It was a table of contents for a thing the reader was
     already looking at, and the videos were the same footage the compare already
     shows, only pre-scrubbed -- three seconds of somebody else dragging the
     slider you have in your hand. The photograph is the material. So the click
     does the one thing worth doing to a 216px thumbnail: it makes it big.
     Enlarged, the slider is finally worth using, so the click-catcher that sits
     over the small card comes off and the drag becomes the interaction. */
  function expand(n){ if(active) big(true); }
  function collapse(){ big(false); }
  function big(on){
    elPrev.classList.toggle('big', !!on);
    root.classList.toggle('zoom', !!on);   // the site panel steps aside
    elPrev.setAttribute('aria-expanded', on?'true':'false');
    place(on);
  }
  function place(isBig){
    const st=stage.getBoundingClientRect();
    if(isBig){
      const w=Math.min(680, st.width-268), h=elPrev.offsetHeight||420;
      elPrev.style.left=Math.round(st.width-24-w)+'px';
      elPrev.style.top=Math.round(Math.max(24,(st.height-h)/2))+'px';
      root.classList.add('nolead');
    }else if(activeBtn){ position(activeBtn); }
  }

  elPrev.addEventListener('click',(e)=>{
    if(e.target.closest('.tl-open')){ touch(); big(true); return; }
    if(e.target.closest('.tl-shut')){ touch(); big(false); }
  });
  addEventListener('keydown',(e)=>{
    if(e.key!=='Escape'||!on) return;
    if(elPrev.classList.contains('big')) big(false); else close();
  });
  addEventListener('resize',()=>{ if(on) place(elPrev.classList.contains('big')); });

  return {
    /* Called from select(). The rail exists for Johor and for nothing else --
       Batam included, which shares the marker at low zoom but has no survey
       imagery of its own, and now its own marker, so nothing about it reaches
       this rail. */
    setMarker(m){
      const isJohor = !!m && m.s.id===HUB;
      if(!isJohor){ if(on){ on=false; marker=null; root.classList.remove('on','prev');
        root.setAttribute('aria-hidden','true'); collapse(); close();
        // a hidden <video> keeps decoding; this panel comes down on every
        // zoom-out, so the corner clip has to be stopped, not just hidden
        if(cornerVid){ try{ cornerVid.pause(); }catch(_){} } } return; }
      if(on) return;                    // already up; do not restart it mid-hover
      marker=m; on=true;
      root.classList.add('on'); root.setAttribute('aria-hidden','false');
      paintParks(); paintFilm();
      const mine=++seq;
      load().then(()=>{ if(mine!==seq) return; if(!built) build(); openDefault(); }).catch(()=>{});
    },
    frame,
    /* Clicking one of the two campus markers on the globe is the same request
       as pressing its button in the rail head, so it is the same code path.
       No-ops when the rail is not up, which is every zoom above SPLIT_D. */
    setPack(id){ if(on) selectPack(id); },
    // open preview or open set list -- either means somebody is reading
    busy(){ return on && elPrev.classList.contains('on'); },
    close(){ big(false); close(); }
  };
})();
tick();
</script>
</body>
</html>
